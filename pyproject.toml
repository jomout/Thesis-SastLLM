[build-system]
requires = ["setuptools==68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-sastllm"
version = "0.1.0"
description = "..."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv==0.9.9",
    "kneed==0.8.6",
    "lightning==2.6.5",
    "matplotlib==3.10.9",
    "numpy==2.4.6",
    "psycopg[binary,pool]==3.3.4",
    "qdrant-client==1.18.0",
    "sqlalchemy==2.0.50",
    "tensorboard==2.20.0",
    "tiktoken==0.13.0",
    "tree-sitter==0.25.2",
    "typer==0.25.1",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "torchaudio==2.11.0",
    "sentence-transformers==5.5.1",
    "datasets==5.0.0",
    "huggingface-hub==1.18.0",
    "shap==0.52.0",
    "spacy==3.8.13",
    "langchain==1.3.4",
    "pydantic-settings==2.14.1",
    "pydantic==2.13.4",
    "langchain-google-genai==4.2.4",
    "langchain-openai==1.2.2",
    "chardet==7.4.3",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.16", 
    "black==26.5.1", 
    "mypy==2.1.0"
]

[tool.ruff]
line-length = 200
target-version = "py314"
exclude = [
    "build",
    "dist",
    "qdrant_storage",
    "models/trained_models",
    "**/migrations/**",
]
extend-select = ["E", "F", "I"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
line-ending = "lf"

[project.scripts]
sastllm = "scripts.cli:main"
sastllm-inspect-distribution = "scripts.inspect_repository_distribution_encoding:main"
sastllm-inspect-timeseries = "scripts.inspect_repository_timeseries_encoding:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sastllm*", "scripts*"]
exclude = ["tests*", "evaluations*", "examples*"]

[tool.pyright]
venvPath = "."
venv = ".venv"
