[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "1.0.0"
description = "Automated Recognition and Guarding against Untrusted Source code using LLM-assisted static analysis"
readme = "README.md"
requires-python = ">=3.14"

keywords = [
    "malicious-code-detection",
    "static-analysis",
    "large-language-models",
    "machine-learning",
    "cybersecurity",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "dotenv==0.9.9",
    "kneed==0.8.6",
    "lightning==2.6.5",
    "matplotlib==3.11.1",
    "numpy==2.5.3",
    "psycopg[binary,pool]==3.3.5",
    "qdrant-client==1.19.0",
    "sqlalchemy==2.0.52",
    "tensorboard==2.21.0",
    "tiktoken==0.14.0",
    "tree-sitter==0.26.0",
    "typer==0.27.2",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "torchaudio==2.11.0",
    "sentence-transformers==6.0.1",
    "datasets==5.0.1",
    "huggingface-hub==1.30.0",
    "joblib==1.6.0",
    "shap==0.52.0",
    "spacy==3.8.16",
    "langchain==1.4.0",
    "pydantic-settings==2.15.0",
    "pydantic==2.13.5",
    "langchain-google-genai==4.4.0",
    "langchain-openai==1.6.0",
    "chardet==7.6.0",
    "structlog==26.1.0",
    "skl2onnx==1.20.0",
    "onnxruntime==1.29.0",
    "onnxscript==0.7.1",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = ["ruff==0.16.6"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
exclude-newer = "1 days"

[tool.ruff]
line-length = 200
target-version = "py314"
include = ["src/**/*.py"]

[tool.ruff.lint]
extend-select = ["E", "F", "I"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
line-ending = "lf"

[project.scripts]
argus = "scripts.cli:main"
argus-inspect-distribution = "scripts.inspect_repository_distribution_encoding:main"
argus-inspect-timeseries = "scripts.inspect_repository_timeseries_encoding:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["argus*", "scripts*"]
exclude = ["tests*", "evaluations*", "examples*"]

[tool.pyright]
venvPath = "."
venv = ".venv"
