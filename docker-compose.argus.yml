services:
  argus_database:
    image: postgres:18-alpine
    container_name: argus_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_argus_data:/var/lib/postgresql
    restart: unless-stopped

  argus_embeddings:
    image: qdrant/qdrant:v1.19
    container_name: argus_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:${QDRANT_PORT:-6333}"
      - "${QDRANT_GRPC_PORT:-6334}:${QDRANT_GRPC_PORT:-6334}"
    volumes:
      - ./argus_storage:/qdrant/storage
    environment:
      QDRANT__STORAGE__STORAGE_PATH: "/qdrant/storage"
      QDRANT__SERVICE__HTTP_PORT: ${QDRANT_PORT:-6333}
      QDRANT__SERVICE__GRPC_PORT: ${QDRANT_GRPC_PORT:-6334}

volumes:
  pg_argus_data:
