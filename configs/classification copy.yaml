classification:
  search:
    save_model_dir: "models/classification/searching_models"
    save_plots_dir: "plots/classification/searching"
    params:
      k: 10661
      seed: 42
    grid_search:
      lr: [0.0001, 0.0005, 0.001]
      weight_decay: [0.0001, 0.0005, 0.001]
      l1_param: [0.0001, 0.0005, 0.001]
      batch_size: [16, 32, 64]
      epochs: [50]

  train:
    save_model_dir: "models/classification/trained_models"
    model:
      name: "lstm"
      embedding_dim: 128
      hidden_dim: 128
      num_layers: 2
      dropout: 0.2
      bidirectional: false
      pooling: "last"
      max_sequence_length: 512
      truncation: "first"
      # Transformer profile:
      # name: "transformer"
      # embedding_dim: 128
      # num_layers: 2
      # num_heads: 4
      # feedforward_dim: 256
      # dropout: 0.2
      # pooling: "mean"
      # max_sequence_length: 256
      # truncation: "first"
      # name: "mlp"
      # hidden_dims: [512, 256]
      # dropout: 0.2
    params:
      k: 10661
      # lr: 0.0005
      # weight_decay: 0.0005
      # l1_param: 0.0005
      # epochs: 50
      # batch_size: 32
      lr: 0.0001
      weight_decay: 0.0001
      l1_param: 0.001
      epochs: 50
      batch_size: 32
      use_weighted_sampler: true
      use_class_weights: false
      seed: 42

  test:
    load_model_dir: "models/classification/trained_models/model_20260613_195403"
    model:
      name: "lstm"
      embedding_dim: 256
      hidden_dim: 256
      num_layers: 1
      dropout: 0.2
      bidirectional: false
      pooling: "last"
      max_sequence_length: 512
      truncation: "first"
      # Transformer test profile (must match the trained sequence length):
      # name: "transformer"
      # embedding_dim: 128
      # num_layers: 2
      # num_heads: 4
      # feedforward_dim: 256
      # dropout: 0.2
      # pooling: "mean"
      # max_sequence_length: 256
      # truncation: "first"
      # name: "mlp"
      # hidden_dims: [512, 256]
      # dropout: 0.2
    params:
      k: 10661
      # lr: 0.0005
      # weight_decay: 0.0005
      # l1_param: 0.0005
      # batch_size: 32
      lr: 0.0001
      weight_decay: 0.0001
      l1_param: 0.001
      batch_size: 32
      use_weighted_sampler: true
      use_class_weights: false
      seed: 42

